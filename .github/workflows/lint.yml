name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    # Runs on all pull requests targeting any branch
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint:
    name: Prettier & Markdownlint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Prettier and markdownlint-cli are devDependencies. Yarn PnP resolves
      # them from yarn.lock, so this job uses the same install as local lint.
      # Update this when Yarn no longer recommends Corepack.
      # See: https://yarnpkg.com/getting-started/install
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting (Prettier)
        run: yarn lint:prettier

      - name: Check Markdown (markdownlint)
        run: yarn lint:markdown
